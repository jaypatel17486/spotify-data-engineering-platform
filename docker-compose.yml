services:

  postgres:
    image: postgres:16

    container_name: spotify_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spotifydb

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: spotify-secret-key

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: spotifydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
      - ~/.aws:/home/airflow/.aws:ro

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username airflow
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com
      --password airflow || true
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    restart: always

    depends_on:
      - airflow-init

    ports:
      - "8085:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: spotify-secret-key

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: spotifydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
      - ~/.aws:/home/airflow/.aws:ro
    
    command: airflow webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    restart: always

    depends_on:
      - airflow-webserver

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: spotify-secret-key

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: spotifydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
      - ~/.aws:/home/airflow/.aws:ro

    command: airflow scheduler

volumes:
  postgres_data: